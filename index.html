<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" id="meta-color-scheme" />
    <meta name="theme-color" content="#f8f7ff" id="meta-theme-color" />
    <title>English Word Sprint — Interactive Vocabulary Game | اضرب في الملي</title>
    <meta name="description" content="Master English vocabulary with English Word Sprint. Quick-thinking word game inspired by 'Idrib fil Milli' featuring category challenges, instant validation, Arabic translations, and progress tracking." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('word_sprint_theme');
          var theme = (stored === 'light' || stored === 'dark') ? stored : null;
          if (!theme) {
            theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
          var metaColor = document.getElementById('meta-theme-color');
          if (metaColor) {
            metaColor.setAttribute('content', theme === 'dark' ? '#0f0d1b' : '#f8f7ff');
          }
          var metaScheme = document.getElementById('meta-color-scheme');
          if (metaScheme) {
            metaScheme.setAttribute('content', theme);
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
